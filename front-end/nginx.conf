server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://vlibras.gov.br https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://vlibras.gov.br https://fonts.googleapis.com; img-src 'self' data: blob: https://vlibras.gov.br https://cdn.jsdelivr.net; font-src 'self' data: https://vlibras.gov.br https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' http://localhost:5050 ws://localhost:5050 https://vlibras.gov.br; frame-src https://vlibras.gov.br; media-src 'self' blob: https://vlibras.gov.br https://cdn.jsdelivr.net; worker-src 'self' blob: https://vlibras.gov.br" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "accelerometer=(self \"https://vlibras.gov.br\"), gyroscope=(self \"https://vlibras.gov.br\"), camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

