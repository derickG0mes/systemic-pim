name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create disposable Compose environment
        shell: bash
        run: |
          printf 'DB_PASSWORD=A1!a%s\n' "$(openssl rand -hex 24)" > .env
          printf 'JWT_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'BACKUP_HMAC_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'CORS_ALLOWED_ORIGINS=http://localhost:8080\n' >> .env

      - name: Create external Data Protection keys volume
        run: docker volume create systemic-pim_aspnet_data_protection_keys

      - name: Start Compose and wait for healthy services
        run: docker compose up -d --build --wait

      - name: Verify API and front-end
        shell: bash
        run: |
          api_status="$(curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused --output /dev/null --write-out '%{http_code}' http://localhost:5050/api/healthcheck)"
          front_status="$(curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused --output /dev/null --write-out '%{http_code}' http://localhost:8080/)"
          printf 'API /api/healthcheck: %s\nFront-end /: %s\n' "$api_status" "$front_status"
          test "$api_status" = "200"
          test "$front_status" = "200"

      - name: Stop Compose and remove disposable environment
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          docker volume rm --force systemic-pim_aspnet_data_protection_keys || true
          rm -f .env

  publish:
    needs: smoke
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive lowercase GHCR image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "api=ghcr.io/${repository}-api" >> "$GITHUB_OUTPUT"
          echo "front=ghcr.io/${repository}-front-end" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: back-end/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.api }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.images.outputs.api }}:latest

      - name: Build and publish front-end image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: front-end/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.front }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.images.outputs.front }}:latest
