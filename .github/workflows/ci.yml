name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Build .NET solution
        run: dotnet build systemic-pim.sln --configuration Release

      - name: Test .NET
        run: dotnet test tests/back-end.Tests.csproj --configuration Release

      - name: Install front-end dependencies
        working-directory: front-end
        run: npm ci

      - name: Build front-end
        working-directory: front-end
        run: npm run build

      - name: Lint front-end
        working-directory: front-end
        run: npm run lint