services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}
    ports:
      - "${SQL_SERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}
    volumes:
      - ./back-end/Scripts:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        until /opt/mssql-tools/bin/sqlcmd -S sqlserver -U "$${DB_USER}" -P "$${DB_PASSWORD}" -C -Q "SELECT 1" >/dev/null 2>&1; do
          echo "Aguardando SQL Server..."
          sleep 2
        done
        /opt/mssql-tools/bin/sqlcmd -b -S sqlserver -U "$${DB_USER}" -P "$${DB_PASSWORD}" -C -i /scripts/01-create-database-idempotent.sql
        /opt/mssql-tools/bin/sqlcmd -b -S sqlserver -U "$${DB_USER}" -P "$${DB_PASSWORD}" -C -i /scripts/02-procedures-views.sql
    restart: "no"

  api:
    build:
      context: .
      dockerfile: back-end/Dockerfile
    env_file:
      - .env
    environment:
      DB_SERVER: sqlserver
      DB_NAME: DB_RESTAURANTE
      ASPNETCORE_ENVIRONMENT: Production
      BACKUP_PATH: ${BACKUP_PATH:-/app/backups}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080}"
    ports:
      - "5050:5050"
    volumes:
      - backup_data:${BACKUP_PATH:-/app/backups}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5050/api/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  front-end:
    build:
      context: .
      dockerfile: front-end/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  sqlserver_data:
  backup_data:
